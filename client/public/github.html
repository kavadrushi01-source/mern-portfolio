<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kavad Rushi | GitHub</title>
    <meta name="description" content="GitHub profile of Kavad Rushi, MERN Stack Developer - React, Node.js, Express, MongoDB and MySQL." />

    <!-- GitHub sets og:image on a profile to just the account avatar, so a
         LinkedIn Featured card pointing straight at the profile renders a
         tiny/placeholder image. These tags serve the proper 1200x630 card;
         the visitor is still redirected to github.com/kavadrushi01-source. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="GitHub" />
    <meta property="og:title" content="Kavad Rushi | GitHub Portfolio" />
    <meta property="og:description" content="MERN Stack Developer - React, Node.js, Express, MongoDB &amp; MySQL. Open-source projects, full-stack apps and experiments." />
    <meta property="og:image" content="https://mern-portfolio-client-three.vercel.app/github-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kavad Rushi - MERN Stack Developer on GitHub" />
    <meta property="og:url" content="https://mern-portfolio-client-three.vercel.app/github" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kavad Rushi | GitHub Portfolio" />
    <meta name="twitter:description" content="MERN Stack Developer - React, Node.js, Express, MongoDB &amp; MySQL." />
    <meta name="twitter:image" content="https://mern-portfolio-client-three.vercel.app/github-og.png" />

    <!-- Redirect to the real GitHub profile. The meta refresh is a fallback
         for LinkedIn's crawler; the script redirect handles real browsers
         immediately. -->
    <link rel="canonical" href="https://github.com/kavadrushi01-source" />
    <meta http-equiv="refresh" content="0; url=https://github.com/kavadrushi01-source" />

    <!-- Redirect FIRST, before the body parses, so the browser navigates
         immediately instead of downloading the preview image. This script is
         inline in <head> and does not block on the PNG below. -->
    <script>
      window.location.replace("https://github.com/kavadrushi01-source");
    </script>

    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #0d1117; color: #e6edf3;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center; padding: 24px;
      }
      .card { max-width: 460px; }
      /* Inline placeholder keeps the box sized before the image arrives; the
         image itself is lazy so it never delays the redirect. */
      .card .thumb {
        width: 100%; aspect-ratio: 1200 / 630; border-radius: 12px;
        display: block; background: #161b22;
      }
      .card a { color: #2dd4bf; font-weight: 600; }
      p { color: #9aa5b1; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="thumb" src="/github-og.png" alt="Kavad Rushi - MERN Stack Developer on GitHub"
           width="1200" height="630" loading="lazy" decoding="async" fetchpriority="low" />
      <p>Redirecting to your GitHub profile&hellip;</p>
      <p><a href="https://github.com/kavadrushi01-source">github.com/kavadrushi01-source</a></p>
    </div>
  </body>
</html>
