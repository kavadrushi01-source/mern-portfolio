name: Keep Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server
        run: |
          curl -s https://kavad-rushi-portfolio.onrender.com/api/portfolio/health || true
          echo "Server pinged at $(date)"
